<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>到达页意图模拟器</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../components/primitives/primitives.css">
  <link rel="stylesheet" href="../components/nav-bar/nav-bar.css">
  <link rel="stylesheet" href="../components/header/header.css">
  <link rel="stylesheet" href="../components/facility-bar/facility-bar.css">
  <link rel="stylesheet" href="../components/section/section.css">
  <link rel="stylesheet" href="../components/taxi-bill/taxi-bill.css">
  <link rel="stylesheet" href="../components/place-card/place-card.css">
  <link rel="stylesheet" href="../components/poi-card/poi-card.css">
  <link rel="stylesheet" href="../components/more-card/more-card.css">
  <link rel="stylesheet" href="../components/dish-card/dish-card.css">
  <link rel="stylesheet" href="../components/tier-label/tier-label.css">
  <link rel="stylesheet" href="../components/nearby-list/nearby-list.css">
  <link rel="stylesheet" href="../components/poi-recommend/poi-recommend.css">
  <link rel="stylesheet" href="../components/place-row/place-row.css">
  <link rel="stylesheet" href="../components/transit-list/transit-list.css">
  <link rel="stylesheet" href="../components/restriction-card/restriction-card.css">
  <link rel="stylesheet" href="../components/service-card/service-card.css">
  <link rel="stylesheet" href="../components/notice/notice.css">
  <link rel="stylesheet" href="../components/order-sheet/order-sheet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body asset-base="../assets/">
  <div class="app">
    <main class="panel">
      <h1>高德到达页 · 意图模拟器</h1>

      <section class="block" aria-labelledby="t-scene">
        <h2 class="block__title" id="t-scene">典型场景</h2>
        <div class="scenes" id="scenes"></div>
      </section>

      <section class="block" aria-labelledby="t-dims">
        <h2 class="block__title" id="t-dims">意图维度</h2>
        <div class="dims" id="dims"></div>
      </section>

      <section class="block" aria-labelledby="t-order">
        <h2 class="block__title" id="t-order">信息架构</h2>
        <ol class="order" id="order"></ol>
        <p class="log" id="log" aria-live="polite"></p>
      </section>
    </main>

    <aside class="stage" aria-label="手机预览">
      <div class="stage__frame" id="frame">
        <div class="phone">
          <div class="screen" id="screen" data-theme="light">   <!-- 手机内固定亮色主题 -->
            <div class="screen__scroll" id="scroll">
              <div class="statusbar" id="statusbar"><img src="../assets/page/status-bar-icons.svg" alt=""><span class="statusbar__time" id="clock">9:41</span></div>
              <div class="page" id="page"></div>
            </div>
            <div class="home-indicator"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="../components/primitives/primitives.js"></script>
  <script src="../components/nav-bar/nav-bar.js"></script>
  <script src="../components/header/header.js"></script>
  <script src="../components/facility-bar/facility-bar.js"></script>
  <script src="../components/section/section.js"></script>
  <script src="../components/taxi-bill/taxi-bill.js"></script>
  <script src="../components/place-card/place-card.js"></script>
  <script src="../components/poi-card/poi-card.js"></script>
  <script src="../components/more-card/more-card.js"></script>
  <script src="../components/dish-card/dish-card.js"></script>
  <script src="../components/tier-label/tier-label.js"></script>
  <script src="../components/nearby-list/nearby-list.js"></script>
  <script src="../components/poi-recommend/poi-recommend.js"></script>
  <script src="../components/place-row/place-row.js"></script>
  <script src="../components/transit-list/transit-list.js"></script>
  <script src="../components/restriction-card/restriction-card.js"></script>
  <script src="../components/service-card/service-card.js"></script>
  <script src="../components/notice/notice.js"></script>
  <script src="../components/order-sheet/order-sheet.js"></script>
  <script src="intent.js"></script>
  <script src="orders.js"></script>
  <script src="render.js"></script>
  <script src="dim-icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
