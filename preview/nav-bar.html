<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顶部导航栏 · 到达页设计系统</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../components/nav-bar/nav-bar.css">
  <style>
    body { margin: 0; padding: 24px 0; background: #fff; font-family: var(--ds-font-family-base); color: #191919; }
    .label { font-size: 14px; font-weight: 500; color: #60636c; margin: 32px 18px 12px; }
    .label:first-child { margin-top: 0; }
    .on-map { background: linear-gradient(135deg, #e6eef7, #f4f1ea); padding: 12px 0; }
    #log { font-size: 12px; color: #00a27f; min-height: 16px; margin: 16px 18px; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <p class="label">Figma 777:3440（实例 777:3441 相同）</p>
  <amap-nav-bar></amap-nav-bar>

  <p class="label">放在有底色的背景上</p>
  <div class="on-map"><amap-nav-bar></amap-nav-bar></div>

  <p class="label">右侧按钮可删减：actions="share"</p>
  <amap-nav-bar actions="share"></amap-nav-bar>

  <div id="log"></div>
  <script src="../components/nav-bar/nav-bar.js"></script>
  <script>
    ['nav-back', 'nav-search', 'nav-share', 'nav-more'].forEach((ev) =>
      document.addEventListener(ev, () => { document.getElementById('log').textContent = ev; }));
  </script>
</body>
</html>
