<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POI 卡片 · 到达页设计系统</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../components/primitives/primitives.css">
  <link rel="stylesheet" href="../components/poi-card/poi-card.css">
  <style>
    body { margin: 0; padding: 24px 16px; background: #eef0f2; font-family: var(--ds-font-family-base); color: #191919; }
    h2.label { font-size: 13px; font-weight: 500; color: #60636c; margin: 32px 0 12px; }
    h2.label:first-child { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, 301px); gap: 24px 12px; }
    .cell { display: grid; gap: 6px; }
    .cap { font-size: 12px; color: #60636c; font-family: ui-monospace, Menlo, monospace; }
    #log { font-size: 12px; color: #00a27f; min-height: 16px; margin-top: 12px; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <h2 class="label">Figma 970:2596 扫街榜分榜卡片 · 9 个主题（旧色名写法，自动映射到新主题）</h2>
  <div class="grid" id="grid"></div>
  <div id="log">点击行 / 星标 / 完整榜单，事件显示在这里</div>

  <h2 class="label">边界情况：超长标题与店名 → 省略；第二行三段；图片缺失 → 占位底色</h2>
  <div class="grid">
    <amap-poi-card id="long" theme="blue" heading="钟楼周边本地人常去的老字号小吃合集" subtitle="精选 128 个热门店铺" asset-base="../assets/"></amap-poi-card>
  </div>

  <script src="../components/primitives/primitives.js"></script>
  <script src="../components/poi-card/poi-card.js"></script>
  <script>
    const IMG = (n) => `../assets/poi/samples/${n}.png`;
    const IMG1 = IMG('laobai-hulatang'), IMG2 = IMG('zhubashi-zenggao');
    // 内容逐字取自 Figma 各实例；店铺图按像素比对 Figma 缩略图对应
    const CARDS = [
      { node: '853:4824', theme: 'orange', heading: '藏在街巷的烟火气', subtitle: '精选 13 个热门店铺', items: [
        { name: '老白家肉丸胡辣汤', distance: '距您 250 米', details: ['人均 ¥18'], image: IMG1 },
        { name: '竹笆市甑糕', distance: '距您 780 米', details: ['人均 ¥15'], image: IMG2 }] },
      { node: '853:4877', theme: 'blue', heading: '臻选好店品质生活', subtitle: '精选 8 个热门店铺', items: [
        { name: '隐庐·会席料理', distance: '距您 320 米', details: ['人均 ¥328', '4.9分'], image: IMG('yinlu-kaiseki') },
        { name: '翠园·粤式茶餐厅', distance: '距您 485 米', details: ['人均 ¥168', '4.8分'], image: IMG('cuiyuan-dimsum') }] },
      { node: '853:4939', theme: 'green', heading: '值得专程去吃一趟', subtitle: '精选 10 个热门店铺', items: [
        { name: '建国路油茶麻花', distance: '距您 60 米', details: ['现炸'], image: IMG('youcha-mahua') },
        { name: '老焦熏肉大饼', distance: '距您 160 米', details: ['现烤'], image: IMG('laojiao-dabing') }] },
      { node: '853:4472', theme: 'indigo', heading: '舒适好住品质之选', subtitle: '精选10家热门酒店', items: [
        { name: '亚朵酒店 (朱雀大街店)', distance: '距您 980 米', details: ['4.9分'], image: IMG('atour-hotel') },
        { name: '钟楼CitiGO欢阁 (钟楼店)', distance: '距您 740 米', details: ['4.8分'], image: IMG('citigo-hotel') }] },
      { node: '853:4531', theme: 'pink', heading: '本地人都在吃什么', subtitle: '精选10个热门店铺', items: [
        { name: '洒金桥菜市', distance: '距您 476 米', details: ['游客少'], image: IMG('sajinqiao-market') },
        { name: '德福巷咖啡街', distance: '距您 508 米', details: ['坐得住'], image: IMG('defuxiang-cafe') }] },
      { node: '853:4592', theme: 'amber', heading: '茶歇时间到', subtitle: '精选13家人气饮品店', items: [
        { name: '% Arabica咖啡', distance: '距您 168 米', details: ['人均 ¥38'], image: IMG('arabica') },
        { name: '喜茶·城市限定店', distance: '距您 98 米', details: ['可自取'], image: IMG('heytea') }] },
      { node: '853:4648', theme: 'purple', heading: '疲惫一扫轻松享受', subtitle: '精选10家热门店铺', items: [
        { name: '松筋堂 (雁塔南路店)', distance: '距您 742 米', details: ['团购 ¥38起'], image: IMG('songjintang') },
        { name: '筋膜实验室', distance: '距您 516 米', details: ['无需预约'], image: IMG('jinmo-lab') }] },
      { node: '853:4703', theme: 'red', heading: '吃腻了换换口味', subtitle: '精选10家热门店铺', items: [
        { name: '巷子里的面', distance: '距您 653 米', details: ['4.9分'], image: IMG('xiangzi-noodle') },
        { name: '松川唐风料理', distance: '距您 451 米', details: ['4.8分'], image: IMG('songchuan-tang') }] },
      { node: '853:4765', theme: 'lime', heading: '一杯慢饮享悠闲', subtitle: '精选13家人气饮品店', items: [
        { name: 'Manner 咖啡', distance: '距您 56 米', details: ['人均 ¥18'], image: IMG('manner') },
        { name: '蓝瓶咖啡 (高新旗舰店)', distance: '距您 32 米', details: ['人均 ¥22'], image: IMG('blue-bottle') }] },
    ];

    const grid = document.getElementById('grid');
    const log = (t) => { document.getElementById('log').textContent = t + ' · ' + new Date().toLocaleTimeString(); };
    for (const c of CARDS) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<span class="cap">${c.theme} · ${c.node}</span>`;
      const card = document.createElement('amap-poi-card');
      card.setAttribute('theme', c.theme);
      card.setAttribute('heading', c.heading);
      card.setAttribute('subtitle', c.subtitle);
      card.setAttribute('asset-base', '../assets/');
      card.items = c.items;
      card.dataset.node = c.node;
      cell.appendChild(card);
      grid.appendChild(cell);
      card.addEventListener('poi-more', () => log(`${c.theme} poi-more`));
      card.addEventListener('poi-select', (e) => log(`${c.theme} poi-select #${e.detail.index + 1} ${e.detail.item.name}`));
      card.addEventListener('poi-favorite', (e) => log(`${c.theme} poi-favorite #${e.detail.index + 1} → ${e.detail.favorited}`));
    }

    document.getElementById('long').items = [
      { name: '回民街老孙家羊肉泡馍（总店）钟楼饭庄', distance: '距您 1.2 公里', details: ['人均 ¥45', '4.7分', '老字号'], image: IMG1, favorited: true },
      { name: '没有图片的店铺', distance: '距您 3.6 公里', details: ['人均 ¥120'] },
    ];
  </script>
</body>
</html>
