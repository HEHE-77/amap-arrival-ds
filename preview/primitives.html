<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基础组件 · 到达页设计系统</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../components/primitives/primitives.css">
  <style>
    body { margin: 0; padding: 24px 16px; background: #fff; font-family: var(--ds-font-family-base); color: #191919; }
    table { border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 18px 14px 0; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { font-size: 12px; font-weight: 500; color: #60636c; }
    code { font-size: 12px; color: #60636c; }
    #log { font-size: 12px; color: #00a27f; min-height: 16px; margin-top: 16px; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body asset-base="../assets/">
  <table>
    <tr><th>组件</th><th>示例</th><th>用在</th></tr>
    <tr><td><code>amap-link</code></td><td><amap-link label="完整榜单"></amap-link></td><td><code>Header 行程回溯 · POI 完整榜单</code></td></tr>
    <tr><td><code>amap-ranking-tag</code></td><td><amap-ranking-tag text="精选10家热门酒店"></amap-ranking-tag></td><td><code>POI 卡片标题区</code></td></tr>
    <tr><td><code>amap-rank-thumb</code></td><td><amap-rank-thumb rank="1" src="../assets/poi/samples/laobai-hulatang.png"></amap-rank-thumb> <amap-rank-thumb rank="12"></amap-rank-thumb></td><td><code>POI 列表行</code></td></tr>
    <tr><td><code>amap-fav-button</code></td><td><amap-fav-button label="示例"></amap-fav-button> <amap-fav-button pressed label="示例"></amap-fav-button></td><td><code>POI 列表行</code></td></tr>
    <tr><td><code>amap-meta-line</code></td><td><amap-meta-line accent-first items='["距您 320 米","人均 ¥328","4.9分"]'></amap-meta-line></td><td><code>POI 列表行 · 饭店卡（sep="·"）</code></td></tr>
    <tr><td><code>amap-rank-ribbon</code></td><td><amap-rank-ribbon rank="1"></amap-rank-ribbon> <amap-rank-ribbon rank="12"></amap-rank-ribbon></td><td><code>饭店卡</code></td></tr>
    <tr><td><code>amap-score-badge</code></td><td><amap-score-badge score="4.8" label="超棒"></amap-score-badge></td><td><code>饭店卡</code></td></tr>
    <tr><td><code>amap-status-tag</code></td><td><amap-status-tag text="营业中"></amap-status-tag></td><td><code>饭店卡</code></td></tr>
    <tr><td><code>amap-deal-tag</code></td><td><amap-deal-tag type="团" price="98" discount="5.6折"></amap-deal-tag> <amap-deal-tag type="券" price="88" discount="8.8折"></amap-deal-tag></td><td><code>饭店卡</code></td></tr>
    <tr><td><code>amap-media-pill</code></td><td style="background:#8a6a5a;padding:10px"><amap-media-pill icon="star" text="10.7w+"></amap-media-pill> <amap-media-pill muted text="1/12"></amap-media-pill></td><td><code>饭店卡图片</code></td></tr>
    <tr><td><code>amap-button</code></td><td style="width:280px"><div style="display:flex;gap:8px"><amap-button style="flex:1" label="看团购"></amap-button><amap-button style="flex:1" variant="secondary" label="查看路线"></amap-button></div></td><td><code>饭店卡</code></td></tr>
    <tr><td><code>amap-hot-review</code></td><td style="width:284px"><amap-hot-review text="关晓彤推荐来的! 冲他家的蒜蓉酸辣螃蟹..." count="252 人在说"></amap-hot-review></td><td><code>饭店卡</code></td></tr>
  </table>
  <div id="log"></div>
  <script src="../components/primitives/primitives.js"></script>
  <script>
    document.addEventListener('fav-change', (e) => { document.getElementById('log').textContent = 'fav-change → ' + e.detail.favorited; });
  </script>
</body>
</html>
