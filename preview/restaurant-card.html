<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>饭店到达卡片 · 到达页设计系统</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../components/primitives/primitives.css">
  <link rel="stylesheet" href="../components/restaurant-card/restaurant-card.css">
  <style>
    body { margin: 0; padding: 24px 16px; background: #eef0f2; font-family: var(--ds-font-family-base); color: #191919; }
    h2.label { font-size: 13px; font-weight: 500; color: #60636c; margin: 32px 0 14px; }
    h2.label:first-child { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, 301px); gap: 28px 16px; }
    #log { font-size: 12px; color: #00a27f; min-height: 16px; margin-top: 12px; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <h2 class="label">默认（Figma 853:5068）</h2>
  <div class="grid">
    <amap-restaurant-card id="default" asset-base="../assets/"
      rank="1"
      name="胡大饭馆 24h (砺街总店)" distance="<100 米"
      score="4.8" score-label="超棒"
      details='["川菜","￥150/人","3652 人导航过"]'
      ranking="碑林区回头客榜单·第 1 名" status="营业中"
      review="关晓彤推荐来的! 冲他家的蒜蓉酸辣螃蟹..." review-count="252 人在说"
      deals='[{"type":"团","price":"98","discount":"5.6折","title":"夏宫双人招牌套餐 (需提前预约)"},{"type":"券","price":"88","discount":"8.8折","title":"100 元代金券"}]'
      image="../assets/restaurant/samples/huda-fanguan.jpg" saves="10.7w+" image-index="1/12">
    </amap-restaurant-card>
  </div>
  <div id="log">点击按钮 / 热评 / 团购，事件显示在这里</div>

  <h2 class="label">边界情况：无排名、无营业状态、一条团购、超长店名与热评、无图</h2>
  <div class="grid">
    <amap-restaurant-card asset-base="../assets/"
      name="老孙家羊肉泡馍（钟楼东大街总店·百年老字号）" distance="1.2 公里"
      score="4.6" score-label="很好"
      details='["清真","￥58/人","1.2w 人导航过"]'
      ranking="新城区老字号榜单·第 12 名"
      review="外地朋友来西安必带的一家，掰馍要自己掰才有灵魂，汤头浓郁不腻" review-count="1.3k 人在说"
      deals='[{"type":"券","price":"45","discount":"9折","title":"50 元代金券，全场通用不限时段"}]'>
    </amap-restaurant-card>
  </div>

  <script src="../components/primitives/primitives.js"></script>
  <script src="../components/restaurant-card/restaurant-card.js"></script>
  <script>
    const log = (t) => { document.getElementById('log').textContent = t + ' · ' + new Date().toLocaleTimeString(); };
    const card = document.getElementById('default');
    ['restaurant-primary', 'restaurant-route', 'restaurant-review'].forEach((ev) => card.addEventListener(ev, () => log(ev)));
    card.addEventListener('restaurant-deal', (e) => log(`restaurant-deal #${e.detail.index + 1} ${e.detail.deal.title}`));
  </script>
</body>
</html>
